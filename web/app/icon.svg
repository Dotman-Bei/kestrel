<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kestrel">
  <!-- Kestrel mark: a K drawn as a lineage fork. One source, two downstream
       paths, and the path that ends in a violation is the accent. Tokens are
       --color-void / --color-surface / --color-signal, inlined because a
       favicon is fetched without the stylesheet. -->
  <rect width="64" height="64" rx="15" fill="#191d26"/>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M20 17V47" stroke="#fbfcfe"/>
    <path d="M20 32L42 18" stroke="#fbfcfe"/>
    <path d="M20 32L42 45" stroke="#d94f38"/>
  </g>
  <circle cx="20" cy="17" r="5.5" fill="#fbfcfe"/>
  <circle cx="42" cy="18" r="5.5" fill="#fbfcfe"/>
  <circle cx="42" cy="45" r="7.5" fill="#d94f38"/>
</svg>
